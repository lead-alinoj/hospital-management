<!-- ================= UNAUTHORIZED WARNING ================= -->
<div class="unauthorized-warning" *ngIf="showUnauthorizedWarning">
  <div class="warning-content">
    <mat-icon class="warning-icon">warning</mat-icon>
    <div class="warning-text">
      <strong>Access Restricted</strong>
      <p>{{ unauthorizedMessage }}</p>
      <p>Redirecting to your dashboard in 5 seconds...</p>
    </div>
    <div class="warning-actions">
      <button mat-button color="warn" (click)="redirectToDashboard()">
        <mat-icon>dashboard</mat-icon>
        Go to Dashboard Now
      </button>
      <button mat-icon-button (click)="closeWarning()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>
</div>

<!-- ================= MAIN HEADER ================= -->
<mat-toolbar color="primary" class="hms-header">
  <div class="container">
    <!-- LOGO AND BURGER -->
    <div class="logo-section">
      <!-- Burger button -->
      <button mat-icon-button (click)="toggleMenu()" class="burger-button">
        <mat-icon>{{ isMenuOpen ? 'close' : 'menu' }}</mat-icon>
      </button>
      
      <!-- Logo -->
      <button mat-button (click)="navigateToDashboard()" class="logo-button">
        <mat-icon>local_hospital</mat-icon>
        <span class="hospital-name">MediCare HMS</span>
      </button>
    </div>

    <!-- ================= USER MENU ================= -->
    <div class="right-section">
      <ng-container *ngIf="isLoggedIn(); else authButtons">
        <button mat-button [matMenuTriggerFor]="userMenu">
          <mat-icon>{{ getRoleIcon(userRole) }}</mat-icon>
          {{ userName }}
          <mat-icon>arrow_drop_down</mat-icon>
        </button>

        <mat-menu #userMenu="matMenu">
          <button mat-menu-item (click)="openProfile()">
            <mat-icon>person</mat-icon> My Profile
          </button>
          <button mat-menu-item (click)="openSettings()">
            <mat-icon>settings</mat-icon> Settings
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon> Logout
          </button>
        </mat-menu>
      </ng-container>

      <ng-template #authButtons>
        <button mat-button routerLink="/login">
          <mat-icon>login</mat-icon> Login
        </button>
        <button mat-raised-button color="accent" routerLink="/register">
          <mat-icon>person_add</mat-icon> Register
        </button>
      </ng-template>
    </div>
  </div>
</mat-toolbar>
