<!-- Unauthorized Warning Banner -->
<div class="unauthorized-warning" *ngIf="showUnauthorizedWarning">
  <div class="warning-content">
    <mat-icon class="warning-icon">warning</mat-icon>
    <div class="warning-text">
      <strong>Access Restricted</strong>
      <p>{{ unauthorizedMessage }}</p>
      <p>Redirecting to your dashboard in 5 seconds...</p>
    </div>
    <div class="warning-actions">
      <button mat-button color="warn" (click)="redirectToDashboard()">
        <mat-icon>dashboard</mat-icon>
        Go to Dashboard Now
      </button>
      <button mat-icon-button (click)="closeWarning()" class="close-warning">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>
</div>

<!-- Main Header -->
<mat-toolbar color="primary" class="hms-header">
  <div class="container">
    <!-- Logo and Hospital Name -->
    <div class="logo-section">
      <button mat-button (click)="navigateToDashboard()" class="logo-button">
        <mat-icon>local_hospital</mat-icon>
        <span class="hospital-name">MediCare HMS</span>
      </button>
      
      <!-- Mobile Menu Toggle -->
      <button mat-icon-button (click)="toggleMenu()" class="mobile-menu-button">
        <mat-icon>{{ isMenuOpen ? 'close' : 'menu' }}</mat-icon>
      </button>
    </div>

    <!-- Navigation Links - Different for each role -->
    <div class="nav-links" [class.nav-links-open]="isMenuOpen">

 <button mat-button

</button>

  <button mat-menu-item routerLink="/admin/attendance" (click)="closeMobileMenuOnNavigation()">
