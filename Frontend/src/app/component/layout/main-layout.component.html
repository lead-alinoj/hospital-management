<div class="main-layout">
  <!-- Header Component -->
  <app-header (toggleSidebar)="toggleSidebar()"></app-header>

  <!-- Mobile overlay -->
  <div class="sidebar-overlay" 
       [class.overlay-visible]="isMobileView && isSidebarOpen"
       (click)="closeSidebarOnMobile()"></div>

  <!-- Main Content Area -->
  <div class="sidebar-container">
    <!-- Sidebar -->
    <nav class="sidebar" 
         [class.sidebar-collapsed]="!isSidebarOpen"
         [class.sidebar-open]="isSidebarOpen">
      
      <!-- User Profile Section -->
      <div class="user-profile">
        <div class="user-avatar">
          {{ userName.charAt(0) || 'U' }}
        </div>
        <div class="user-info">
          <h3 class="user-name">{{ userName || 'User' }}</h3>
          <p class="user-role">{{ userRole || 'Role' }}</p>
        </div>
      </div>

      <!-- Main Menu Section -->
  <div class="menu-section">

  <ng-container *ngFor="let item of filteredMenuItems">

    <!-- NORMAL ITEM -->
    <a *ngIf="!item.children"
       [routerLink]="item.route"
       routerLinkActive="active"
       class="menu-item"
       (click)="closeSidebarOnMobile()">
      <mat-icon>{{ item.icon }}</mat-icon>
      <span>{{ item.label }}</span>
    </a>

    <!-- DROPDOWN ITEM -->
    <div *ngIf="item.children" class="menu-group">
      <div class="menu-item group-header"
           (click)="item.expanded = !item.expanded">
        <mat-icon>{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
        <mat-icon class="arrow">
          {{ item.expanded ? 'expand_less' : 'expand_more' }}
        </mat-icon>
      </div>

      <div class="submenu" *ngIf="item.expanded">
        <a *ngFor="let child of item.children"
           [routerLink]="child.route"
           routerLinkActive="active"
           class="submenu-item"
           (click)="closeSidebarOnMobile()">
          <mat-icon>{{ child.icon }}</mat-icon>
          <span>{{ child.label }}</span>
        </a>
      </div>
    </div>

  </ng-container>

  <mat-divider></mat-divider>

  <button class="menu-item" (click)="logout()">
    <mat-icon>logout</mat-icon>
    Logout
  </button>

</div>


      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <div class="footer-item">
          <mat-icon class="footer-icon">help</mat-icon>
          <span class="footer-label">Help & Support</span>
        </div>
        <div class="footer-item">
          <mat-icon class="footer-icon">info</mat-icon>
          <span class="footer-label">About System</span>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
